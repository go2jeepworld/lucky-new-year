<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Room - Lucky New Year!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧧</text></svg>">
</head>
<body>
    <div class="container" style="max-width: 1400px;">
        <!-- Header -->
        <header class="flex items-center justify-between mb-lg" style="flex-wrap: wrap; gap: var(--spacing-md);">
            <div class="flex items-center gap-md">
                <a href="/" class="btn btn-outline" style="padding: var(--spacing-sm) var(--spacing-md);">
                    ← Back
                </a>
                <div>
                    <h2 style="font-size: var(--font-size-xl);">Room Code</h2>
                    <div class="room-code" id="roomCodeDisplay">{{ room_code }}</div>
                </div>
            </div>
            <div class="flex items-center gap-md">
                <div id="gameStatus" class="luck-badge" style="font-size: var(--font-size-base);">
                    <span>⏳</span> Waiting...
                </div>
                <button id="startGameBtn" class="btn btn-primary" style="display: none;">
                    <span>🎮</span> Start Game
                </button>
            </div>
        </header>

        <!-- Main Game Area -->
        <main style="display: grid; grid-template-columns: 1fr 300px; gap: var(--spacing-lg);">
            <!-- Left: Game Board -->
            <div class="game-board">
                <!-- Players Area -->
                <section class="card mb-lg" style="padding: var(--spacing-lg);">
                    <h3 class="mb-md">👥 Players</h3>
                    <div id="playersList" class="flex gap-md" style="flex-wrap: wrap;">
                        <!-- Players will be rendered here -->
                    </div>
                </section>

                <!-- Game Status / Current Turn -->
                <section id="turnInfo" class="card mb-lg" style="padding: var(--spacing-lg); display: none;">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3>Current Turn</h3>
                            <p id="currentTurnName" class="text-red" style="font-size: var(--font-size-xl); font-weight: 700;">-</p>
                        </div>
                        <div class="text-center">
                            <div id="turnTimer" style="width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--chinese-red) 0%, var(--chinese-red-dark) 100%); color: white; display: flex; align-items: center; justify-content: center; font-size: var(--font-size-xl); font-weight: 700;">
                                30
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Game Log / Action Area -->
                <section class="card mb-lg" style="padding: var(--spacing-lg); min-height: 150px;">
                    <h3 class="mb-md">📜 Game Log</h3>
                    <div id="gameLog" style="max-height: 200px; overflow-y: auto; font-size: var(--font-size-sm);">
                        <p style="color: var(--text-secondary);">Waiting for game to start...</p>
                    </div>
                </section>

                <!-- Hand Cards -->
                <section id="handSection" class="card" style="padding: var(--spacing-lg); display: none;">
                    <h3 class="mb-md">🎴 Your Hand <span id="handCount" class="luck-badge" style="margin-left: var(--spacing-sm);">0</span></h3>
                    <div id="handCards" class="flex gap-md" style="flex-wrap: wrap; justify-content: center; min-height: 180px;">
                        <!-- Cards will be rendered here -->
                    </div>
                    <p id="selectTargetMsg" class="text-center mt-md" style="color: var(--chinese-red); display: none;">
                        Select a target player to use this card
                    </p>
                </section>
            </div>

            <!-- Right: Chat -->
            <aside>
                <div class="chat-box" style="height: 600px;">
                    <div style="padding: var(--spacing-md); background: linear-gradient(135deg, var(--chinese-red) 0%, var(--chinese-red-dark) 100%); color: white; border-radius: var(--radius-lg) var(--radius-lg) 0 0;">
                        <h4 style="margin: 0;">💬 Chat</h4>
                    </div>
                    <div id="chatMessages" class="chat-messages">
                        <!-- Messages will be rendered here -->
                    </div>
                    <div class="chat-input" style="display: flex; gap: 8px; width: 100%;">
                        <input type="text" id="chatInput" placeholder="Type a message..." maxlength="100" style="flex: 1; min-width: 0;">
                        <button id="sendChatBtn" class="btn btn-primary" style="padding: 8px 16px; min-width: 80px; white-space: nowrap; font-size: 14px;">
                            Send
                        </button>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Quiz Modal -->
    <div id="quizModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h3>🧧 Culture Quiz</h3>
            <p id="quizQuestion" style="font-size: var(--font-size-lg); margin-bottom: var(--spacing-lg);"></p>
            <div id="quizOptions" class="quiz-options">
                <!-- Options will be rendered here -->
            </div>
            <div id="quizResult" style="margin-top: var(--spacing-lg); text-align: center; display: none;">
                <p id="quizResultText" style="font-size: var(--font-size-lg); font-weight: 600;"></p>
                <p id="quizExplanation" style="color: var(--text-secondary); margin-top: var(--spacing-sm);"></p>
            </div>
        </div>
    </div>

    <!-- Peek Result Modal -->
    <div id="peekModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h3>🐼 Panda Peek Result</h3>
            <p id="peekTargetName" class="text-center mb-md"></p>
            <div id="peekCards" class="flex gap-md" style="flex-wrap: wrap; justify-content: center;">
                <!-- Cards will be rendered here -->
            </div>
            <div class="text-center mt-lg">
                <button id="closePeekBtn" class="btn btn-primary">Close</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal-overlay" style="display: none;">
        <div class="modal text-center">
            <div style="font-size: 64px; margin-bottom: var(--spacing-md);">🎉</div>
            <h2 class="text-red mb-md">Game Over!</h2>
            <p id="winnerText" style="font-size: var(--font-size-xl); margin-bottom: var(--spacing-lg);"></p>
            <div id="finalScores" class="mb-lg">
                <!-- Scores will be rendered here -->
            </div>
            <div class="flex gap-md" style="justify-content: center;">
                <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
                <a href="/" class="btn btn-outline">Back to Lobby</a>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // Pass room code to JS
        const ROOM_CODE = "{{ room_code }}";
    </script>
    <script src="{{ url_for('static', filename='js/sound.js') }}"></script>
    <script src="{{ url_for('static', filename='js/room.js') }}"></script>
</body>
</html>
